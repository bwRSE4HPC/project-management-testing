name: probe-issue-fields

# Throwaway. Verifies two assumptions before the scheduling workflow is written:
#   1. GITHUB_TOKEN with issues:write can read Repository.issueFields and run
#      setIssueFieldValue (write + restore).
#   2. The payload key carrying the changed field name on field_added/field_removed.
# Delete once both are answered.

on:
  issues:
    types: [opened, field_added, field_removed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to run the write probe against"
        required: false
        default: "3"

permissions:
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Payload shape probe
        env:
          EVENT: ${{ toJSON(github.event) }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          FIELD_NAME: ${{ github.event.issue_field.name }}
          FIELD_ID: ${{ github.event.issue_field.id }}
          FIELD_DATATYPE: ${{ github.event.issue_field.data_type }}
          FIELD_VALUE: ${{ toJSON(github.event.issue_field_value) }}
          CHANGES: ${{ toJSON(github.event.changes) }}
          ISSUE: ${{ toJSON(github.event.issue.number) }}
        run: |
          echo "event_name=$EVENT_NAME  action=$ACTION  issue=$ISSUE  actor=$GITHUB_ACTOR"
          echo "--- expression probes (blank means that key path is wrong) ---"
          echo "github.event.issue_field.name      -> [$FIELD_NAME]"
          echo "github.event.issue_field.id        -> [$FIELD_ID]"
          echo "github.event.issue_field.data_type -> [$FIELD_DATATYPE]"
          echo "github.event.issue_field_value     -> $FIELD_VALUE"
          echo "github.event.changes               -> $CHANGES"
          echo "--- real keys present on the payload ---"
          printf '%s' "$EVENT" | jq -c '{top_level_keys: keys}'
          printf '%s' "$EVENT" | jq -c '{issue_field_keys: (.issue_field | keys?)}'
          printf '%s' "$EVENT" | jq -c '{issue_field: .issue_field}'
          printf '%s' "$EVENT" | jq -c '{issue_field_value: .issue_field_value}'
          printf '%s' "$EVENT" | jq -c '{changes: .changes}'

      - name: GITHUB_TOKEN write probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number || '3' }}
          FIELD_START: Start date
          FIELD_TARGET: Target date
          SENTINEL_START: "1999-01-04"
          SENTINEL_TARGET: "1999-01-10"
        run: |
          set -uo pipefail
          OWNER="${REPO_FULL%/*}"; REPO="${REPO_FULL#*/}"
          FAIL=0
          ok()  { echo "OK: $*"; }
          err() { echo "::error::$*"; FAIL=1; }
          gql() { gh api graphql --input -; }   # reads the JSON body on stdin

          case "$ISSUE_NUMBER" in
            ''|*[!0-9]*) err "issue number '$ISSUE_NUMBER' is not an integer"; exit 1 ;;
          esac

          echo "== runner tooling =="
          gh --version | head -1; python3 --version
          echo "org=$OWNER repo=$REPO issue=#$ISSUE_NUMBER"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            echo "token under test: GITHUB_TOKEN (the Actions-provided token)"
          else
            echo "token under test: NOT GITHUB_TOKEN - using local gh credentials"
          fi

          # ---------- resolve field names to node ids, repo-scoped ----------
          RESOLVE='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){viewerCanSeeIssueFields issueFields(first:50){nodes{... on IssueFieldDate{name id dataType}... on IssueFieldNumber{name id dataType}... on IssueFieldSingleSelect{name id}... on IssueFieldMultiSelect{name id}... on IssueFieldText{name id}}}}}'
          jq -nc --arg o "$OWNER" --arg n "$REPO" --arg q "$RESOLVE" \
            '{query:$q,variables:{owner:$o,name:$n}}' | gql > "$RUNNER_TEMP/resolve.json"
          if ! jq -e '.data.repository.issueFields.nodes' "$RUNNER_TEMP/resolve.json" >/dev/null; then
            jq -c '.errors // .' "$RUNNER_TEMP/resolve.json"
            err "Repository.issueFields not readable with GITHUB_TOKEN"
            exit 1
          fi
          echo "viewerCanSeeIssueFields=$(jq -r .data.repository.viewerCanSeeIssueFields "$RUNNER_TEMP/resolve.json")"
          echo "visible fields: $(jq -c '[.data.repository.issueFields.nodes[] | {name, id}]' "$RUNNER_TEMP/resolve.json")"
          idof() { jq -r --arg f "$1" '[.data.repository.issueFields.nodes[] | select(.name==$f)][0].id // empty' "$RUNNER_TEMP/resolve.json"; }
          SID=$(idof "$FIELD_START"); TID=$(idof "$FIELD_TARGET"); DID=$(idof Duration)
          [ -n "$SID" ] && ok "resolved '$FIELD_START' -> $SID" || err "'$FIELD_START' not visible"
          [ -n "$TID" ] && ok "resolved '$FIELD_TARGET' -> $TID" || err "'$FIELD_TARGET' not visible"
          [ -n "$DID" ] && ok "resolved 'Duration' -> $DID" || err "'Duration' not visible"
          [ "$FAIL" = 0 ] || exit 1

          # ---------- snapshot helper: full issue field values, reduced ----------
          GETISSUE='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){issue(number:$number){id createdAt issueFieldValues(first:20){nodes{... on IssueFieldDateValue{value field{... on IssueFieldDate{name}}}... on IssueFieldNumberValue{value field{... on IssueFieldNumber{name}}}}}}}}'
          snap() { # $1=raw out  $2=summary out
            jq -nc --arg o "$OWNER" --arg n "$REPO" --argjson num "$ISSUE_NUMBER" --arg q "$GETISSUE" \
              '{query:$q,variables:{owner:$o,name:$n,number:$num}}' | gql > "$1" || return 1
            jq -c '{
              id: .data.repository.issue.id,
              start:  ([.data.repository.issue.issueFieldValues.nodes[]? | select(.field.name == "'"${FIELD_START}"'")][0].value),
              target: ([.data.repository.issue.issueFieldValues.nodes[]? | select(.field.name == "'"${FIELD_TARGET}"'")][0].value),
              duration: ([.data.repository.issue.issueFieldValues.nodes[]? | select(.field.name == "Duration")][0].value)
            }' "$1" > "$2"
          }

          snap "$RUNNER_TEMP/pre.raw" "$RUNNER_TEMP/pre.json" || { err "initial read failed"; exit 1; }
          echo "pre-state:  $(cat "$RUNNER_TEMP/pre.json")"
          IID=$(jq -r .id "$RUNNER_TEMP/pre.json")
          PRE_START=$(jq -r '.start // ""' "$RUNNER_TEMP/pre.json")
          PRE_TARGET=$(jq -r '.target // ""' "$RUNNER_TEMP/pre.json")

          MUT='mutation($id:ID!,$fields:[IssueFieldCreateOrUpdateInput!]!){setIssueFieldValue(input:{issueId:$id,issueFields:$fields}){clientMutationId}}'
          runmut() { # $1=fields array json  $2=optional out file
            jq -nc --arg q "$MUT" --arg id "$IID" --argjson fields "$1" \
              '{query:$q,variables:{id:$id,fields:$fields}}' | gql > "${2:-/dev/stdout}"
          }

          # ---------- undo anything this probe wrote ----------
          restore() {
            rc=$?
            if [ -f "$RUNNER_TEMP/wrote.flag" ]; then
              echo "== restoring pre-state (script rc=$rc) =="
              FIELDS=$(jq -nc --arg sid "$SID" --arg tid "$TID" --arg ps "$PRE_START" --arg pt "$PRE_TARGET" '
                [ (if $ps == "" then {fieldId:$sid, delete:true} else {fieldId:$sid, dateValue:$ps} end),
                  (if $pt == "" then {fieldId:$tid, delete:true} else {fieldId:$tid, dateValue:$pt} end) ]')
              runmut "$FIELDS" | jq -c 'if .errors then .errors else "restore mutation accepted" end'
              rm -f "$RUNNER_TEMP/wrote.flag"
              if snap "$RUNNER_TEMP/post.raw" "$RUNNER_TEMP/post.json"; then
                echo "post-state: $(cat "$RUNNER_TEMP/post.json")"
                # id/duration are not touched by this probe; compare only what it wrote
                keys='del(.id) | del(.duration)'
                PRE_CMP=$(jq -Sc "$keys" "$RUNNER_TEMP/pre.json")
                POST_CMP=$(jq -Sc "$keys" "$RUNNER_TEMP/post.json")
                if [ -z "$PRE_CMP" ] || [ -z "$POST_CMP" ]; then
                  err "net-zero comparison produced no data (jq failed)"
                elif [ "$PRE_CMP" = "$POST_CMP" ]; then
                  ok "net-zero: issue #${ISSUE_NUMBER} back to its pre-probe field values ($PRE_CMP)"
                else
                  err "NET-ZERO FAILED - issue left modified. pre=$PRE_CMP post=$POST_CMP"
                fi
              else
                err "could not re-read the issue to confirm restoration"
              fi
            fi
            [ "$FAIL" = 0 ] || exit 1
          }
          trap restore EXIT

          # ---------- write sentinels, verify visibility ----------
          echo "== write probe =="
          FIELDS=$(jq -nc --arg sid "$SID" --arg tid "$TID" --arg s "$SENTINEL_START" --arg t "$SENTINEL_TARGET" \
            '[{fieldId:$sid,dateValue:$s},{fieldId:$tid,dateValue:$t}]')
          touch "$RUNNER_TEMP/wrote.flag"
          runmut "$FIELDS" "$RUNNER_TEMP/write.json"
          if jq -e '.errors == null and .data != null' "$RUNNER_TEMP/write.json" >/dev/null; then
            ok "setIssueFieldValue accepted GITHUB_TOKEN with issues:write"
          else
            err "setIssueFieldValue rejected GITHUB_TOKEN: $(jq -c '.errors' "$RUNNER_TEMP/write.json")"
          fi

          snap "$RUNNER_TEMP/mid.raw" "$RUNNER_TEMP/mid.json"
          echo "mid-state:  $(cat "$RUNNER_TEMP/mid.json")"
          MID_START=$(jq -r .start "$RUNNER_TEMP/mid.json"); MID_TARGET=$(jq -r .target "$RUNNER_TEMP/mid.json")
          if [ "$MID_START" = "$SENTINEL_START" ] && [ "$MID_TARGET" = "$SENTINEL_TARGET" ]; then
            ok "one bulk write set both dates and both are immediately readable"
          else
            err "written values not visible (start=$MID_START target=$MID_TARGET)"
          fi

          # ---------- REST read path with the same token ----------
          echo "== REST cross-check =="
          if gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$OWNER/$REPO/issues/$ISSUE_NUMBER/issue-field-values" \
              --jq '[.[] | {issue_field_name, issue_field_id, value}]' > "$RUNNER_TEMP/rest.json" 2>"$RUNNER_TEMP/rest.err"; then
            cat "$RUNNER_TEMP/rest.json"
            jq -e --arg s "$SENTINEL_START" 'any(.[]; .issue_field_name == "'"${FIELD_START}"'" and .value == $s)' \
              "$RUNNER_TEMP/rest.json" >/dev/null \
              && ok "REST read path works with GITHUB_TOKEN (integer issue_field_id visible)" \
              || err "REST read did not reflect the GraphQL write"
          else
            err "REST read failed: $(cat "$RUNNER_TEMP/rest.err")"
          fi

          # ---------- timeline cost of one bulk write ----------
          # timelineItems is oldest-first, so read the tail to see this probe's own entries
          echo "== timeline entries created by one bulk write =="
          gh api graphql -f query="query { repository(owner:\"$OWNER\", name:\"$REPO\") { issue(number:$ISSUE_NUMBER){
            timelineItems(last:6){ nodes{ __typename ... on IssueFieldAddedEvent { createdAt value actor{ login } } } } } } }" \
            | jq -c '[.data.repository.issue.timelineItems.nodes[] | select(.|.__typename|test("Field"))]'

          echo "Duration on this issue: $(jq -r .duration "$RUNNER_TEMP/mid.json")"
          echo "actor for the write: $GITHUB_ACTOR"
